version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/PiBot-website"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    # Major upgrades (e.g. Angular 21 -> 22, TypeScript 5 -> 7) are breaking
    # migrations handled deliberately, not via automated PRs. Security patches
    # and minor/patch updates still flow.
    ignore:
      - dependency-name: "@angular/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@angular-devkit/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "zone.js"
        update-types: ["version-update:semver-major"]
    groups:
      angular:
        patterns:
          - "@angular/*"
          - "@angular-devkit/*"
        update-types:
          - "minor"
          - "patch"
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/PiBot-provisioning-app"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    # Major upgrades (e.g. Angular 21 -> 22, TypeScript 5 -> 7) are breaking
    # migrations handled deliberately, not via automated PRs. Security patches
    # and minor/patch updates still flow.
    ignore:
      - dependency-name: "@angular/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@angular-devkit/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "zone.js"
        update-types: ["version-update:semver-major"]
    groups:
      angular:
        patterns:
          - "@angular/*"
          - "@angular-devkit/*"
        update-types:
          - "minor"
          - "patch"
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
